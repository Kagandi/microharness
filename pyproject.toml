[project]
name = "microharness"
version = "0.1.0"
description = "A minimal, zero-dependency, and pluggable AI agent microframework in Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Dima Kagan" }
]
dependencies = []

[project.scripts]
microharness = "main:main"
mini-harness = "main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
