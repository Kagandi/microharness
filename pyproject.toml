[project]
name = "mini-harness"
version = "0.1.0"
description = "A minimal, educational, and pluggable AI agent harness in Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mini-Harness Contributors" }
]
dependencies = []

[project.scripts]
mini-harness = "main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
